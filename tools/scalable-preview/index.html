<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能体验容量验证 · 合成数据</title>
  <style>
    body{margin:0;background:#1c1e22;color:#f4f4f4;font-family:system-ui,sans-serif}
    .capacity-preview{max-width:1280px;margin-inline:auto;padding:24px;box-sizing:border-box;min-width:0}
    .capacity-preview-header{display:grid;gap:12px;margin-bottom:20px}
    .capacity-preview-header h1{font-size:24px;font-weight:600;margin:0}
    .capacity-preview-header p{line-height:1.6;margin:0}
    .capacity-preview-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .capacity-preview-controls label{display:flex;align-items:center;gap:8px}
    .capacity-preview-summary{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
    .capacity-preview-content{min-width:0}
    @media(max-width:600px){.capacity-preview{padding:12px}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="./bundle.js"></script></body>
</html>
