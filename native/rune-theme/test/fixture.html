<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rune material-layer proof</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #25202e; color: #ededef; font: 16px/1.5 system-ui, sans-serif; }
  #stage { position: relative; width: 390px; height: 640px; margin: 20px auto; overflow: clip; background: #7a203f; }
  #rune-theme-canvas { position: absolute; inset: 0; width: 390px; height: 640px; display: block; }
  #source { position: relative; z-index: 1; padding: 32px; }
  #source h1 { margin: 0; font-size: 22px; }
  #source p { max-width: 28ch; color: #c8c4cc; }
  #source code { color: #d7e5ff; }
  #controls { display: flex; gap: 8px; margin: 0 auto 20px; width: 390px; }
  button { min-height: 40px; color: #ededef; background: #1b1b1f; border: 1px solid #ffffff22; border-radius: 10px; }
  button:focus-visible { outline: 2px solid #d8e6ff; outline-offset: 2px; }
</style>
<main>
  <div id="stage">
    <canvas id="rune-theme-canvas" aria-hidden="true"></canvas>
    <article id="source">
      <h1>Original DOM remains above Rune</h1>
      <p>Code, math, Markdown, focus and actions remain host-owned. <code>surface: fluted-glass</code></p>
      <button id="dom-button">Host-owned action</button>
    </article>
  </div>
  <div id="controls">
    <button id="update">Update surface</button>
    <button id="glass">Update real glass</button>
    <button id="narrow">Narrow to 320px</button>
    <button id="dispose">Dispose Rune</button>
  </div>
</main>
<script type="module" src="./fixture.mjs"></script>
</html>
